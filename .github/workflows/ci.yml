name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Lint
        run: uvx ruff check .
      - name: Test
        run: uv run --no-project --with pytest pytest -q
      - name: Demo report builds
        run: uv run --no-project python tiktok_stats.py --demo
